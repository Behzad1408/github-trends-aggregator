name: Daily GitHub Tracker Bot

on:
  schedule:
    # Runs at 23:59 UTC every day
    - cron: '59 23 * * *'
  workflow_dispatch: # Allows manual triggering from the GitHub Actions UI

permissions:
  contents: write # Required for the keepalive workflow to push dummy commits

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute Tracker Script
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npx tsx src/aggregator.ts
        
      - name: Keepalive Workflow
        uses: gautamkrishnar/keepalive-workflow@v2
        with:
          # This action automatically pushes an empty commit every 50 days 
          # to ensure GitHub doesn't disable this cron job due to inactivity.
          commit_message: "chore: Keepalive to prevent cron suspension [skip ci]"